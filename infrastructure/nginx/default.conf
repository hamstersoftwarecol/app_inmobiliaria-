# Reverse proxy: api.<domain> -> PHP-FPM, <domain> -> Next.js.
# TLS terminates at Cloudflare/the load balancer in production; add
# `listen 443 ssl` blocks here when terminating TLS on this host.

server {
    listen 80;
    # api-internal: Compose network alias used by the web container for SSR.
    server_name api.localhost api.* api-internal;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 26m;
    server_tokens off;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
