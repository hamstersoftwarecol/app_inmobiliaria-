openapi: 3.1.0
info:
  title: Hitlease Real Estate API
  version: 1.0.0-rc.1
  summary: REST API for the Hitlease Real Estate brokerage platform (New Jersey).
  description: |
    Central API consumed by the Next.js web app and the Flutter mobile app.

    **Authentication**
    * Web (first-party SPA): call `GET /sanctum/csrf-cookie`, then `POST /auth/login` with
      `credentials: include` and the `X-XSRF-TOKEN` header. Session cookies are HttpOnly.
    * Mobile: `POST /auth/token` returns a Sanctum personal access token; send it as
      `Authorization: Bearer <token>`.

    **Errors** always use the envelope `{"error": {"code", "message", "details", "request_id"}}`.
    Clients should branch on `error.code`, never on the message text.

    Operations tagged with `x-status: planned` are part of the agreed contract but are
    **not implemented yet**; they return 404 today.
  contact:
    name: Hitlease Engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.hitlease.example/api/v1
    description: Illustrative production URL (configure the real domain)
  - url: http://localhost:8000/api/v1
    description: Local development
security:
  - cookieSession: []
  - bearerToken: []
tags:
  - name: System
    description: Health and metadata.
  - name: Auth
    description: Registration, login (cookie or token), MFA, password and session management.
  - name: Admin Users
    description: User administration with role-hierarchy guards.
  - name: Admin Roles
    description: Roles and granular permissions (RBAC).
  - name: Admin Audit
    description: Append-only audit trail.
  - name: Admin MLS
    description: MLS provider catalogue and encrypted connections (licence-gated).
  - name: Properties
    description: Public listings (internal and MLS) with per-provider compliance applied.
  - name: Listing Management
    description: Staff and agent management of internal listings, publication and photos.
  - name: Admin MLS Sync
    description: MLS sync jobs, monitoring and field mappings.
  - name: Search
    description: Location autocomplete, favorites and saved searches with e-mail alerts.
  - name: Agents
    description: Public agent directory (only verified, opted-in agents).
  - name: Agent Self-Service
    description: The signed-in agent's own profile and licence submissions.
  - name: Admin Agency
    description: Agencies and offices.
  - name: Admin Agents
    description: Agent profiles and the licence verification workflow.
  - name: CRM
    description: Leads, pipeline, activities, tasks and reports (`/crm/*` requires MFA for staff). Public inquiries create leads.
  - name: Appointments
    description: Showing availability, requests and bookings (no double-booking, DST-safe), reminders.
  - name: Notifications
    description: In-app notification center, e-mail preferences and one-click unsubscribe.
  - name: Admin Reports
    description: Agency KPI dashboard and audited CSV exports.
  - name: Deals
    description: Offers and counter-offers, transactions, milestones and parties (staff need MFA).
  - name: Documents
    description: Private, versioned transaction documents with signed short-lived downloads and optional ClamAV scanning.
  - name: Messaging
    description: Private conversations between clients, agents and staff.

paths:
  /health:
    get:
      tags: [System]
      operationId: health
      summary: Liveness check
      security: []
      responses:
        "200":
          description: API is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, examples: [v1] }
  /health/ready:
    get:
      tags: [System]
      operationId: readiness
      summary: "Readiness: database (with PostGIS), cache and storage must work; queue backlog and scheduler heartbeat are reported as degraded. Not rate-limited; reveals no details"
      security: []
      responses:
        "200":
          description: Ready (status ok or degraded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Self-registration (buyer/tenant or seller/owner)
      description: |
        Staff and agent accounts are created by administrators only.
        With `device_name` a token is returned (mobile); from a stateful web origin a cookie session starts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
                  token: { $ref: "#/components/schemas/AccessToken" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithCookie
      summary: Web login (cookie session)
      description: |
        Only for first-party web origins (Sanctum stateful domains). If the user has MFA enabled the
        response is `{"mfa_required": true}` and the login must be completed with `POST /auth/mfa/challenge`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, maxLength: 128 }
                remember: { type: boolean, default: false }
      responses:
        "200":
          description: Logged in, or MFA challenge required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400":
          description: Not a stateful (browser) request — use `/auth/token`. Error code `stateful_session_required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/mfa/challenge:
    post:
      tags: [Auth]
      operationId: completeMfaChallenge
      summary: Complete a web login with a TOTP or recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: "^\\d{6}$" }
                recovery_code: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "422":
          description: "`invalid_mfa_code`, `mfa_challenge_expired` or validation errors"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/token:
    post:
      tags: [Auth]
      operationId: issueToken
      summary: Mobile login (personal access token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 100 }
                mfa_code: { type: string, description: Required when the account has MFA enabled }
                recovery_code: { type: string }
      responses:
        "201":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [data, token]
                properties:
                  data: { $ref: "#/components/schemas/User" }
                  token: { $ref: "#/components/schemas/AccessToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`invalid_credentials`, `mfa_required`, `invalid_mfa_code` or validation errors"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      summary: Current user with roles and effective permissions
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current token or end the cookie session
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset link
      description: Always answers 202 to prevent account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset the password with the e-mailed token (revokes all sessions)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { $ref: "#/components/schemas/Password" }
                password_confirmation: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/email/verify/{id}/{hash}:
    get:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify an e-mail address from the signed link
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: hash, in: path, required: true, schema: { type: string } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  verified: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/email/verification-notification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Re-send the verification e-mail
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "202": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/profile:
    patch:
      tags: [Auth]
      operationId: updateProfile
      summary: Update own profile (changing e-mail requires `current_password`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                phone: { type: [string, "null"] }
                locale: { type: string, enum: [en, es] }
                timezone: { type: string, description: US IANA time zone, examples: [America/New_York] }
                current_password: { type: string }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: Change password (other sessions are revoked by default)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { $ref: "#/components/schemas/Password" }
                password_confirmation: { type: string }
                logout_other_sessions: { type: boolean, default: true }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/deactivate:
    post:
      tags: [Auth]
      operationId: deactivateOwnAccount
      summary: Deactivate own account (password + MFA code if enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "204": { description: Account deactivated and all sessions revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: startMfaSetup
      summary: Start TOTP enrolment (returns secret + otpauth URI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "200":
          description: Secret generated (not active until confirmed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_url: { type: string, format: uri }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/mfa/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfa
      summary: Activate MFA with a first valid code; returns one-time recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: MFA enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfa_enabled: { type: boolean, const: true }
                  recovery_codes: { type: array, items: { type: string } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/mfa/recovery-codes:
    post:
      tags: [Auth]
      operationId: regenerateRecoveryCodes
      summary: Regenerate recovery codes (password + TOTP code)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "200":
          description: New codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/mfa/disable:
    post:
      tags: [Auth]
      operationId: disableMfa
      summary: Disable MFA (password + TOTP code)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "200":
          description: MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfa_enabled: { type: boolean, const: false }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: Active browser sessions and mobile tokens of the current user
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuthSession" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      tags: [Auth]
      operationId: revokeOtherSessions
      summary: Revoke every session/token except the current one
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/sessions/{session}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke one session (`web:<hash>` or `token:<id>`)
      parameters:
        - { name: session, in: path, required: true, schema: { type: string, examples: ["token:42"] } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/security-events:
    get:
      tags: [Auth]
      operationId: listSecurityEvents
      summary: Own security activity (logins, MFA, password changes)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /admin/users:
    get:
      tags: [Admin Users]
      operationId: adminListUsers
      summary: List users (permission `users.view_any`)
      description: Staff must have MFA enabled to use any `/admin` route (`mfa_enrollment_required`).
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/RoleName" } }
        - { name: status, in: query, schema: { type: string, enum: [active, deactivated] } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, last_name, -last_name, email, -email] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin Users]
      operationId: adminCreateUser
      summary: Create a user with roles (only roles below the actor's level)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password, roles]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: [string, "null"] }
                locale: { type: string, enum: [en, es] }
                timezone: { type: string }
                password: { $ref: "#/components/schemas/Password" }
                roles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/RoleName" } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users/{user}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Admin Users]
      operationId: adminGetUser
      summary: Get a user
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin Users]
      operationId: adminUpdateUser
      summary: Update a user's profile (hierarchy enforced)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: [string, "null"] }
                locale: { type: string, enum: [en, es] }
                timezone: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users/{user}/roles:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Admin Users]
      operationId: adminSyncUserRoles
      summary: Replace a user's roles (no privilege escalation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/RoleName" } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users/{user}/deactivate:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Admin Users]
      operationId: adminDeactivateUser
      summary: Deactivate a user and revoke all their sessions/tokens
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{user}/reactivate:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Admin Users]
      operationId: adminReactivateUser
      summary: Reactivate a user
      responses:
        "200":
          description: Reactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/roles:
    get:
      tags: [Admin Roles]
      operationId: adminListRoles
      summary: Roles with permissions and user counts (`roles.view`)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Role" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/permissions:
    get:
      tags: [Admin Roles]
      operationId: adminListPermissions
      summary: Permission catalogue (`roles.view`)
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, examples: [users.view_any] }
                        group: { type: string }
                        description: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/roles/{role}/permissions:
    put:
      tags: [Admin Roles]
      operationId: adminUpdateRolePermissions
      summary: Replace a role's permissions (`roles.manage`; super_admin role is locked)
      parameters:
        - { name: role, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: { type: array, items: { type: string } }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/dashboard:
    get:
      tags: [Admin Reports]
      operationId: adminDashboard
      summary: "Agency KPIs and daily/weekly activity for a period of agency days (`reports.view`; staff need MFA)"
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: Defaults to 29 days before `to` }
        - { name: to, in: query, schema: { type: string, format: date }, description: Defaults to today (agency time zone) }
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AgencyDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/exports/{dataset}:
    parameters:
      - { name: dataset, in: path, required: true, schema: { type: string, enum: [leads, showings, offers, transactions, listings] } }
      - { name: from, in: query, schema: { type: string, format: date } }
      - { name: to, in: query, schema: { type: string, format: date } }
    get:
      tags: [Admin Reports]
      operationId: adminExport
      summary: "CSV export (UTF-8 with BOM; formula-like cells neutralised). Needs `reports.view` plus the agency-wide view permission of the dataset; every export is audited"
      responses:
        "200":
          description: CSV file (`Content-Disposition` attachment)
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /admin/audit-logs:
    get:
      tags: [Admin Audit]
      operationId: adminListAuditLogs
      summary: Audit trail (`audit_logs.view`)
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [security, admin, data, mls] } }
        - { name: event, in: query, description: Prefix match, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: from, in: query, description: "Date (agency calendar day, America/New_York, from 00:00) or date-time", schema: { type: string, examples: ["2026-10-01"] } }
        - { name: to, in: query, description: "Date (whole agency calendar day included) or date-time; must be ≥ from", schema: { type: string, examples: ["2026-10-10"] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/mls/providers:
    get:
      tags: [Admin MLS]
      operationId: adminListMlsProviders
      summary: MLS providers with display rules and connections (`mls.view`)
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MlsProvider" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin MLS]
      operationId: adminCreateMlsProvider
      summary: Register a provider (`mls.manage`). Created disabled, status `pending_authorization`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MlsProviderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MlsProvider" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/mls/providers/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Admin MLS]
      operationId: adminGetMlsProvider
      summary: Get a provider
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MlsProvider" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin MLS]
      operationId: adminUpdateMlsProvider
      summary: Update a provider, its display rules or its authorization status
      description: |
        Setting `status=authorized` or `is_enabled=true` requires `licence_confirmed=true`
        (and `licence_reference` for authorization). Enabling a provider that is not authorized fails
        with `mls_not_authorized`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MlsProviderInput"
                - type: object
                  properties:
                    status: { $ref: "#/components/schemas/MlsProviderStatus" }
                    is_enabled: { type: boolean }
                    licence_confirmed: { type: boolean }
                    licence_reference: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MlsProvider" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/mls/providers/{provider}/connections:
    post:
      tags: [Admin MLS]
      operationId: adminCreateMlsConnection
      summary: Store an encrypted connection (credentials are never returned)
      parameters:
        - { name: provider, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, environment, base_url, credentials]
              properties:
                name: { type: string }
                environment: { type: string, enum: [sandbox, production] }
                base_url: { type: string, format: uri, pattern: "^https://" }
                token_url: { type: string, format: uri, pattern: "^https://" }
                credentials:
                  type: object
                  description: OAuth2 client credentials or a static access token.
                  properties:
                    client_id: { type: string }
                    client_secret: { type: string, writeOnly: true }
                    scope: { type: string }
                    access_token: { type: string, writeOnly: true }
      responses:
        "201":
          description: Provider with connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MlsProvider" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/mls/connections/{connection}/test:
    post:
      tags: [Admin MLS]
      operationId: adminTestMlsConnection
      summary: Authentication handshake only (no data import)
      parameters:
        - { name: connection, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Handshake succeeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTestResult" }
        "422":
          description: Handshake failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTestResult" }

