        - { name: license, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_source, verification_reference, expires_on]
              properties:
                verification_source: { $ref: "#/components/schemas/VerificationSource" }
                verification_reference: { type: string, minLength: 3, maxLength: 255, description: "How it was checked, e.g. lookup date or document id" }
                expires_on: { type: string, format: date }
                notes: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AgentLicense" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/licenses/{license}/reject:
    post:
      tags: [Admin Agents]
      operationId: adminRejectLicense
      summary: Reject a pending licence with a reason
      parameters:
        - { name: license, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseReason" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AgentLicense" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/licenses/{license}/revoke:
    post:
      tags: [Admin Agents]
      operationId: adminRevokeLicense
      summary: Revoke a verified licence with a reason
      parameters:
        - { name: license, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseReason" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AgentLicense" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /property-types:
    get:
      tags: [Properties]
      operationId: listPropertyTypes
      summary: Property type catalogue
      security: []
      responses:
        "200":
          description: Types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        code: { $ref: "#/components/schemas/PropertyTypeCode" }
                        name_en: { type: string }
                        name_es: { type: string }

  /properties:
    get:
      tags: [Properties]
      operationId: listProperties
      summary: Search public listings
      description: |
        Attribute filters plus one geographic filter (`bbox`, `lat`+`lng`+`radius_miles`, or `polygon`).
        Geographic filters only match listings whose exact location is public (`address.displayed`), so
        narrowing an area never reveals a suppressed address. Rate limited by the `search` limiter
        (60/min per user or visitor). Send `X-Hitlease-Client: mobile` from the mobile app so MLS listings
        whose licence forbids mobile display are excluded.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientChannel"
        - { name: listing_type, in: query, schema: { type: string, enum: [sale, rent] } }
        - { name: property_type, in: query, schema: { $ref: "#/components/schemas/PropertyTypeCode" } }
        - { name: city, in: query, description: Case-insensitive exact match, schema: { type: string, maxLength: 100 } }
        - { name: county, in: query, description: Case-insensitive exact match, schema: { type: string, maxLength: 100 } }
        - { name: postal_code, in: query, schema: { type: string, pattern: "^\\d{5}$" } }
        - { name: min_price, in: query, schema: { type: number, minimum: 0 } }
        - { name: max_price, in: query, description: Must be ≥ min_price, schema: { type: number, minimum: 0 } }
        - { name: min_beds, in: query, schema: { type: integer, minimum: 0, maximum: 20 } }
        - { name: min_baths, in: query, schema: { type: number, minimum: 0, maximum: 20 } }
        - { name: min_sqft, in: query, schema: { type: integer, minimum: 0 } }
        - { name: max_sqft, in: query, schema: { type: integer, minimum: 0 } }
        - { name: min_year, in: query, schema: { type: integer, minimum: 1600, maximum: 2100 } }
        - name: "amenities[]"
          in: query
          description: All listed amenities must be present (max 10).
          style: form
          explode: true
          schema: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Amenity" } }
        - { name: bbox, in: query, description: "\"west,south,east,north\" in degrees (WGS84). Cannot be combined with polygon or radius.", schema: { type: string, examples: ["-74.06,40.70,-74.00,40.76"] } }
        - { name: lat, in: query, description: Centre latitude (with lng and radius_miles), schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, description: Centre longitude, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius_miles, in: query, schema: { type: number, exclusiveMinimum: 0, maximum: 50 } }
        - { name: polygon, in: query, description: "3–50 \"lng lat\" points separated by commas (ring closed automatically)", schema: { type: string, maxLength: 2000, examples: ["-74.20 40.70,-74.14 40.70,-74.17 40.77"] } }
        - { name: sort, in: query, description: "`distance` requires a radius search; otherwise newest is used", schema: { type: string, enum: [newest, price_asc, price_desc, sqft_desc, distance], default: newest } }
        - $ref: "#/components/parameters/Page"
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 48 } }
      responses:
        "200":
          description: Paginated listing cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/PublicPropertySummary" } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /locations:
    get:
      tags: [Search]
      operationId: autocompleteLocations
      summary: Cities and ZIP codes that currently have public listings
      description: Digits are matched as a ZIP prefix, text as a city prefix. `center` is computed only from listings with a public location.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientChannel"
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 60 } }
      responses:
        "200":
          description: Up to 8 suggestions, most listings first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LocationSuggestion" } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{slug}:
    get:
      tags: [Properties]
      operationId: getProperty
      summary: Public listing detail
      description: MLS listings include attribution, disclaimer and freshness, and only the fields and photos the provider allows.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientChannel"
        - { name: slug, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]+$" } }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PublicProperty" }
        "404": { $ref: "#/components/responses/NotFound" }

  /manage/properties:
    get:
      tags: [Listing Management]
      operationId: manageListProperties
      summary: Listings visible to the user (agents only their own)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [internal, mls] } }
        - { name: published, in: query, schema: { type: boolean } }
        - { name: status, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ManagedProperty" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Listing Management]
      operationId: manageCreateProperty
      summary: Create an internal listing (unpublished; agents list under their own profile)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ManagedProperty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /manage/properties/{property}:
    parameters:
      - { name: property, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Listing Management]
      operationId: manageGetProperty
      summary: Listing with media, MLS info and status/price history
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ManagedProperty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Listing Management]
      operationId: manageUpdateProperty
      summary: Update an internal listing (MLS listings are read-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ManagedProperty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Listing Management]
      operationId: manageDeleteProperty
      summary: Soft-delete an internal listing (`properties.delete`)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /manage/properties/{property}/publish:
    post:
      tags: [Listing Management]
      operationId: managePublishProperty
      summary: Publish (`properties.publish`); fails with `listing_not_publishable` when required fields are missing
      parameters:
        - { name: property, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ManagedProperty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /manage/properties/{property}/unpublish:
    post:
      tags: [Listing Management]
      operationId: manageUnpublishProperty
      summary: Take a listing off the public site (`properties.publish`)
      parameters:
        - { name: property, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Unpublished
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ManagedProperty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /manage/properties/{property}/media:
    post:
      tags: [Listing Management]
      operationId: manageUploadPhoto
      summary: Upload a photo (JPEG/PNG/WebP, ≥640×480, ≤15 MB); re-encoded to strip EXIF/GPS metadata
      parameters:
        - { name: property, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
                caption: { type: string, maxLength: 300 }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PropertyMedia" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /manage/properties/{property}/media/order:
    put:
      tags: [Listing Management]
      operationId: manageReorderPhotos
      summary: Reorder photos
      parameters:
        - { name: property, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order: { type: array, items: { type: integer } }
      responses:
        "200":
          description: Photos in the new order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PropertyMedia" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /manage/properties/{property}/media/{media}:
    delete:
      tags: [Listing Management]
      operationId: manageDeletePhoto
      summary: Delete an uploaded photo
      parameters:
        - { name: property, in: path, required: true, schema: { type: integer } }
        - { name: media, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/mls/sync:
    post:
      tags: [Admin MLS Sync]
      operationId: adminTriggerMlsSync
      summary: Queue a sync (`mls.sync`); returns the pending job if one is already queued/running
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id, type]
              properties:
                connection_id: { type: integer }
                type: { type: string, enum: [import, incremental, reconcile] }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MlsSyncJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/mls/sync-jobs:
    get:
      tags: [Admin MLS Sync]
      operationId: adminListMlsSyncJobs
      summary: Sync job history (`mls.view`)
      parameters:
        - { name: connection_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [queued, running, succeeded, partial, failed] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MlsSyncJob" } }
                  meta: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/mls/sync-jobs/{job}:
    get:
      tags: [Admin MLS Sync]
      operationId: adminGetMlsSyncJob
      summary: Sync job with its latest 200 log lines
      parameters:
        - { name: job, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/MlsSyncJob"
                      - type: object
                        properties:
                          logs:
                            type: array
                            items:
                              type: object
                              properties:
                                level: { type: string, enum: [info, warning, error] }
                                message: { type: string }
                                listing_key: { type: [string, "null"] }
                                created_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/mls/status:
    get:
      tags: [Admin MLS Sync]
      operationId: adminMlsStatus
      summary: Monitoring panel data (per-connection health, staleness, counts, duplicate candidates)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sync_enabled: { type: boolean }
                      connections:
                        type: array
                        items:
                          type: object
                          properties:
                            connection_id: { type: integer }
                            name: { type: string }
                            environment: { type: string }
                            status: { type: string }
                            last_error: { type: [string, "null"] }
                            last_synced_at: { type: [string, "null"], format: date-time }
                            is_stale: { type: boolean }
                            listings:
                              type: object
                              properties:
                                total: { type: integer }
                                removed: { type: integer }
                                published: { type: integer }
                            last_job: { oneOf: [{ $ref: "#/components/schemas/MlsSyncJob" }, { type: "null" }] }
                      duplicate_candidates:
                        type: array
                        items:
                          type: object
                          properties:
                            address_key: { type: string }
                            property_ids: { type: string }
                            providers: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/mls/providers/{provider}/field-mappings:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Admin MLS Sync]
      operationId: adminGetMlsFieldMappings
      summary: Provider field-name overrides of the RESO Data Dictionary
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/FieldMapping" } }
    put:
      tags: [Admin MLS Sync]
      operationId: adminReplaceMlsFieldMappings
      summary: Replace all mappings (`mls.manage`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappings]
              properties:
                mappings: { type: array, items: { $ref: "#/components/schemas/FieldMapping" } }
      responses:
        "200":
          description: Updated mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/FieldMapping" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ------------------------------------------------------------------ Public inquiries
  /inquiries:
    post:
      tags: [CRM]
      operationId: createInquiry
      summary: Public contact form (listing, agent profile or general)
      description: |
        Creates a lead, or adds the inquiry to the person's open lead when the normalized e-mail or phone
        matches. Listing inquiries go to the listing agent, agent-page inquiries to that agent; otherwise
        staff with `leads.assign` are notified. The response is identical in every case (including the
        `website` honeypot) and never reveals whether the person was known. Rate limit: 5/min and 20/h per visitor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, contact_consent]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: [string, "null"], maxLength: 100 }
                email: { type: [string, "null"], format: email, description: Required without phone }
                phone: { type: [string, "null"], description: Required without email }
                message: { type: [string, "null"], maxLength: 2000 }
                intent: { type: [string, "null"], enum: [buy, rent, sell, other, null] }
                property_slug: { type: string, description: A publicly visible listing (404 otherwise) }
                agent_slug: { type: string, description: A publicly listed agent (404 otherwise) }
                preferred_language: { type: string, enum: [en, es] }
                contact_consent: { type: boolean, const: true, description: Consent to be contacted about this inquiry (stored with time and IP) }
                marketing_consent: { type: boolean }
                website: { type: string, description: "Honeypot: leave empty" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /crm/leads:
    get:
      tags: [CRM]
      operationId: listLeads
      summary: Leads visible to the user (`leads.view_any`, or `leads.view_assigned` for own leads)
      parameters:
        - { name: search, in: query, description: "Name, e-mail or phone", schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LeadStatus" } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/LeadSource" } }
        - { name: assigned, in: query, description: "`me`, `unassigned` or an agent id", schema: { type: string } }
        - { name: open, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated leads, most recently active first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Lead" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [CRM]
      operationId: createLead
      summary: Enter a lead by hand (`leads.create`); agents without `leads.assign` own what they create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /crm/leads/board:
    get:
      tags: [CRM]
      operationId: leadBoard
      summary: Kanban columns (totals and the 25 most recently active leads per stage)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/LeadSource" } }
        - { name: assigned, in: query, schema: { type: string } }
      responses:
        "200":
          description: One column per stage, in pipeline order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        status: { $ref: "#/components/schemas/LeadStatus" }
                        total: { type: integer }
                        leads: { type: array, items: { $ref: "#/components/schemas/Lead" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /crm/leads/{lead}:
    parameters:
      - { name: lead, in: path, required: true, schema: { type: integer } }
    get:
      tags: [CRM]
      operationId: getLead
      summary: Lead with timeline, tasks, possible duplicates and the caller's allowed actions
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
                  meta:
                    type: object
                    properties:
                      possible_duplicates:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            full_name: { type: string }
                            status: { $ref: "#/components/schemas/LeadStatus" }
                            created_at: { type: [string, "null"], format: date-time }
                      can:
                        type: object
                        properties:
                          update: { type: boolean }
                          assign: { type: boolean }
                          merge: { type: boolean }
                          delete: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [CRM]
      operationId: updateLead
      summary: Update contact details (`leads.update_any`, or `leads.update_assigned` for own leads)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [CRM]
      operationId: deleteLead
      summary: Soft-delete a lead (`leads.delete`, audited)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
  /crm/leads/{lead}/status:
    parameters:
      - { name: lead, in: path, required: true, schema: { type: integer } }
    post:
      tags: [CRM]
      operationId: setLeadStatus
      summary: Move the lead to another stage (`lost` requires a reason)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/LeadStatus" }
                lost_reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /crm/leads/{lead}/assign:
    parameters:
      - { name: lead, in: path, required: true, schema: { type: integer } }
    post:
      tags: [CRM]
      operationId: assignLead
      summary: Assign to an active agent or unassign (`leads.assign`, audited, agent notified)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: [integer, "null"] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /crm/leads/{lead}/merge:
    parameters:
      - { name: lead, in: path, required: true, description: The duplicate to fold in (soft-deleted), schema: { type: integer } }
    post:
      tags: [CRM]
      operationId: mergeLead
      summary: Merge a duplicate into another lead (`leads.update_any`, audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into_lead_id]
              properties:
                into_lead_id: { type: integer }
      responses:
        "200":
          description: The surviving lead
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /crm/leads/{lead}/activities:
    parameters:
      - { name: lead, in: path, required: true, schema: { type: integer } }
    post:
      tags: [CRM]
      operationId: logLeadActivity
      summary: Log a call, e-mail, meeting or note (append-only)
      description: The first logged call/e-mail/meeting sets `first_contacted_at` and moves a `new` lead to `contacted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [note, call, email, meeting] }
                body: { type: string, maxLength: 5000, description: Required for notes }
                occurred_at: { type: string, format: date-time, description: Not in the future; defaults to now }
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LeadActivity" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /crm/tasks:
    get:
      tags: [CRM]
      operationId: listCrmTasks
      summary: Own tasks (or everyone's with `scope=all` and `leads.assign`)
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, overdue, completed], default: open } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, all], default: mine } }
        - { name: lead_id, in: query, schema: { type: integer } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Tasks, soonest due first (completed ones most recent first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/CrmTask" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [CRM]
      operationId: createCrmTask
      summary: Create a task (for others only with `leads.assign`); reminders go out 15 minutes before due
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmTaskInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CrmTask" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /crm/tasks/{task}:
    parameters:
      - { name: task, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [CRM]
      operationId: updateCrmTask
      summary: Edit, reschedule (re-arms the reminder) or complete a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmTaskInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CrmTask" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [CRM]
      operationId: deleteCrmTask
      summary: Delete a task
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /crm/reports/summary:
    get:
      tags: [CRM]
      operationId: crmSummary
      summary: Pipeline figures for leads created in a period (`reports.view` + `leads.view_any`)
      parameters:
        - { name: from, in: query, description: "Agency calendar day (default 30 days before `to`)", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Agency calendar day (default today); max range one year", schema: { type: string, format: date } }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CrmSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /properties/{slug}/showing-slots:
    get:
      tags: [Appointments]
      operationId: listShowingSlots
      summary: Free showing slots for a listing (public; no personal data)
      description: |
        Slots come from the listing agent's weekly hours (local time of the agency, converted per date so
        they stay at the same local times across DST), minus time off and live showings, at least 2 hours
        ahead and at most 30 days ahead. Only internal listings that are active or coming soon are bookable.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientChannel"
        - { name: slug, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]+$" } }
        - { name: from, in: query, description: "Agency calendar day (default today)", schema: { type: string, format: date } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 14, default: 7 } }
      responses:
        "200":
          description: Slots per day
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ShowingSlots" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appointments:
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: Showings visible to the user (own requests, hosted showings, or all with `appointments.view_any`)
      parameters:
        - { name: when, in: query, schema: { type: string, enum: [upcoming, past], default: upcoming } }
        - { name: status, in: query, schema: { type: string, enum: [requested, confirmed, declined, cancelled, completed, no_show] } }
        - { name: role, in: query, schema: { type: string, enum: [requester, host] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated showings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Appointments]
      operationId: requestShowing
      summary: Request a published slot (`appointments.request`); joins or opens the visitor's CRM lead
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientChannel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_slug, starts_at, contact_consent]
              properties:
                property_slug: { type: string }
                starts_at: { type: string, format: date-time, description: Must equal a slot returned by showing-slots }
                phone: { type: string }
                notes: { type: string, maxLength: 1000 }
                contact_consent: { type: boolean, const: true }
      responses:
        "201":
          description: Requested (awaiting the agent's confirmation)
          headers:
            Idempotent-Replayed: { description: "`true` when this is the stored response of an earlier request with the same key", schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`slot_unavailable` or `idempotency_in_progress`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /appointments/book:
    post:
      tags: [Appointments]
      operationId: bookShowing
      summary: Book a confirmed showing (own calendar with `appointments.manage_own`, any agent with `appointments.manage_any`)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at]
              properties:
                agent_id: { type: integer, description: Managers only }
                property_id: { type: integer }
                lead_id: { type: integer, description: Must be visible to the caller; fills the contact details }
                contact_name: { type: string, description: Required without lead_id }
                contact_email: { type: string, format: email }
                contact_phone: { type: string }
                starts_at: { type: string, format: date-time }
                duration_minutes: { type: integer, minimum: 15, maximum: 240 }
                notes: { type: string }
      responses:
        "201":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /appointments/{appointment}:
    parameters:
      - { name: appointment, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: A showing (requester, host or `appointments.view_any`)
      responses:
        "200":
          description: Showing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /appointments/{appointment}/confirm:
    parameters:
      - { name: appointment, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Appointments]
      operationId: confirmShowing
      summary: "Confirm a requested showing (host or manager); the visitor gets an .ics invite"
      responses:
        "200":
          description: Updated showing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /appointments/{appointment}/decline:
    parameters:
      - { name: appointment, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Appointments]
      operationId: declineShowing
      summary: "Decline a requested showing (host or manager)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: Updated showing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /appointments/{appointment}/cancel:
    parameters:
      - { name: appointment, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Appointments]
      operationId: cancelShowing
      summary: "Cancel a requested or confirmed showing (requester, host or manager)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: Updated showing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /appointments/{appointment}/reschedule:
    parameters:
      - { name: appointment, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Appointments]
      operationId: rescheduleShowing
      summary: "Move a showing: requesters pick a published slot (back to requested); hosts any free time (stays confirmed)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at]
              properties:
                starts_at: { type: string, format: date-time }
      responses:
        "200":
          description: Updated showing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /appointments/{appointment}/complete:
    parameters:
      - { name: appointment, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Appointments]
      operationId: completeShowing
      summary: "Record the outcome after the start time (host or manager)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [completed, no_show] }
                feedback_rating: { type: integer, minimum: 1, maximum: 5 }
                feedback_comment: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Updated showing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/availability:
    get:
      tags: [Appointments]
      operationId: getOwnAvailability
      summary: The agent's weekly showing hours and upcoming time off
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Availability" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Appointments]
      operationId: replaceOwnAvailability
      summary: Replace the weekly hours (local agency time; windows on a day must not overlap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windows]
              properties:
                windows: { type: array, maxItems: 35, items: { $ref: "#/components/schemas/AvailabilityWindow" } }
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Availability" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/time-off:
    post:
      tags: [Appointments]
      operationId: addTimeOff
      summary: Block a period (no slots are offered during it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at]
              properties:
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                reason: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TimeOff" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/time-off/{timeOff}:
    delete:
      tags: [Appointments]
      operationId: deleteTimeOff
      summary: Remove time off
      parameters:
        - { name: timeOff, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: In-app notifications, newest first
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Page"
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AppNotification" } }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: unreadNotificationCount
      summary: Unread count (for the header badge)
      responses:
        "200": { $ref: "#/components/responses/UnreadCount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/notifications/{notification}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      parameters:
        - { name: notification, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/UnreadCount" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark everything as read
      responses:
        "200": { $ref: "#/components/responses/UnreadCount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: E-mail preference per category (in-app notifications are always stored)
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [Notifications]
      operationId: updateNotificationPreferences
      summary: Turn optional e-mails on or off (marketing changes are audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mail]
              properties:
                mail:
                  type: object
                  additionalProperties: { type: boolean }
                  description: "Keys: showing_updates, showing_reminders, lead_updates, task_reminders, saved_search_alerts, licence_updates, offer_updates, transaction_updates, messages, marketing"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/NotificationPreferences" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /notifications/unsubscribe:
    post:
      tags: [Notifications]
      operationId: unsubscribe
      summary: One-click unsubscribe from an e-mail link (RFC 8058; token in body or query)
      security: []
      parameters:
        - { name: token, in: query, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  event: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------------ Offers & transactions (Sprint 9)
  /offers:
    get:
      tags: [Deals]
      operationId: listOffers
      summary: Latest offer of each negotiation the user may see (agents on either side; `offers.view_any`)
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OfferStatus" } }
        - { name: property_id, in: query, schema: { type: integer } }
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Deals]
      operationId: createOffer
      summary: "Record a buyer's offer (agents act as the buyer's agent; managers may name one). `submit: true` sends it at once"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferCreateRequest" }
      responses:
        "201":
          description: Created offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /offers/{offer}:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Deals]
      operationId: getOfferChain
      summary: The whole negotiation (original offer and counters), oldest first
      responses:
        "200":
          description: Negotiation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Offer" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Deals]
      operationId: updateOfferDraft
      summary: Edit a draft (author side only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferTerms" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /offers/{offer}/submit:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Deals]
      operationId: submitOffer
      summary: "Submit a draft to the other side"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /offers/{offer}/withdraw:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Deals]
      operationId: withdrawOffer
      summary: "Withdraw a draft or submitted offer (author side)"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /offers/{offer}/reject:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Deals]
      operationId: rejectOffer
      summary: "Reject a submitted offer (responding side)"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /offers/{offer}/counter:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Deals]
      operationId: counterOffer
      summary: "Counter a submitted offer (responding side): the offer becomes `countered` and a new offer from the other side is submitted"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/OfferTerms"
                - type: object
                  properties:
                    note: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Counter-offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /offers/{offer}/accept:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Deals]
      operationId: acceptOffer
      summary: "Accept (responding side): opens the transaction with default NJ milestones and puts an internal listing under contract (`property_under_contract` if one is already open)"
      responses:
        "201":
          description: Opened transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /transactions:
    get:
      tags: [Deals]
      operationId: listTransactions
      summary: Transactions the user works on or takes part in (`transactions.view_any` sees all)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, closed, cancelled] } }
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /transactions/{transaction}:
    parameters:
      - { name: transaction, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Deals]
      operationId: getTransaction
      summary: "A transaction (agents on it, linked clients, `transactions.view_any`); party contact details only for managers"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Deals]
      operationId: updateTransaction
      summary: Change the closing date (open transactions; agents on it or `transactions.manage_any`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                closing_date: { type: [string, "null"], format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /transactions/{transaction}/close:
    parameters:
      - { name: transaction, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Deals]
      operationId: closeTransaction
      summary: Mark as closed (listing → closed; documents get their retention date)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                closing_date: { type: string, format: date, description: "Today or earlier (defaults to today, agency time)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /transactions/{transaction}/cancel:
    parameters:
      - { name: transaction, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Deals]
      operationId: cancelTransaction
      summary: Cancel (listing back to active; the accepted offer becomes `terminated`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /transactions/{transaction}/milestones:
    parameters:
      - { name: transaction, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Deals]
      operationId: addMilestone
      summary: Add a custom milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                due_date: { type: [string, "null"], format: date }
                notes: { type: [string, "null"], maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /transactions/{transaction}/milestones/{milestone}:
    parameters:
      - { name: transaction, in: path, required: true, schema: { type: integer } }
      - { name: milestone, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Deals]
      operationId: updateMilestone
      summary: Edit, reschedule (re-arms its reminder) or complete a milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                due_date: { type: [string, "null"], format: date }
                notes: { type: [string, "null"], maxLength: 1000 }
                completed: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Deals]
      operationId: deleteMilestone
      summary: Delete a custom milestone (default milestones can only be edited)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /transactions/{transaction}/participants:
    parameters:
      - { name: transaction, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Deals]
      operationId: addParticipant
      summary: "Add a party; an e-mail matching an active account links it (shared documents, deal conversation)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, name]
              properties:
                role: { type: string, enum: [buyer, seller, attorney, lender, title, other] }
                name: { type: string, maxLength: 200 }
                email: { type: [string, "null"], format: email }
                phone: { type: [string, "null"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /transactions/{transaction}/participants/{participant}:
    parameters:
      - { name: transaction, in: path, required: true, schema: { type: integer } }
      - { name: participant, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Deals]
      operationId: removeParticipant
      summary: Remove a party
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /transactions/{transaction}/documents:
    parameters:
      - { name: transaction, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: "Documents of a transaction (clients see only `shared` ones)"
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Document" } }
                  meta:
                    type: object
                    properties:
                      can_upload: { type: boolean }
                      scan_required: { type: boolean, description: "When true, files are downloadable only after a clean malware scan" }
                      max_kb: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: "Upload a document (PDF, JPG, PNG, DOCX, XLSX; size limit in `meta.max_kb`). Stored on a private disk"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, category, visibility]
              properties:
                file: { type: string, format: binary }
                title: { type: string, maxLength: 200 }
                category: { $ref: "#/components/schemas/DocumentCategory" }
                visibility: { type: string, enum: [internal, shared] }
      responses:
        "201":
          description: Uploaded document
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /documents/{document}:
    parameters:
      - { name: document, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Documents]
      operationId: updateDocument
      summary: Rename, re-categorise or change visibility (visibility changes are audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                category: { $ref: "#/components/schemas/DocumentCategory" }
                visibility: { type: string, enum: [internal, shared] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete (soft; files are kept until the retention purge)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /documents/{document}/versions:
    parameters:
      - { name: document, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Documents]
      operationId: uploadDocumentVersion
      summary: Upload a new version
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Document with the new version
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /documents/{document}/versions/{version}/link:
    parameters:
      - { name: document, in: path, required: true, schema: { type: integer } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Documents]
      operationId: createDocumentLink
      summary: "Short-lived signed download URL (logged). `document_unavailable`: 409 while a scan is pending, 403 if malware was found"
      responses:
        "200":
          description: Signed link
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: { type: string, format: uri }
                      expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /documents/download/{version}:
    parameters:
      - { name: version, in: path, required: true, schema: { type: integer } }
      - { name: expires, in: query, required: true, schema: { type: integer } }
      - { name: signature, in: query, required: true, schema: { type: string } }
    get:
      tags: [Documents]
      operationId: downloadDocument
      summary: Download through a signed link (no session; attachment with `nosniff` and a sandbox CSP)
      security: []
      responses:
        "200":
          description: File
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------------ Messaging (Sprint 9)
  /conversations:
    get:
      tags: [Messaging]
      operationId: listConversations
      summary: The user's conversations, most recent first (participants only — no administrator access)
      parameters:
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ConversationSummary" } }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Messaging]
      operationId: startConversation
      summary: "Start (or continue) a conversation. Clients can write to active agents only; `transaction_id` includes everyone on the deal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                recipient_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 10 }
                agent_slug: { type: string, description: "Public agent slug (from listing or profile pages)" }
                transaction_id: { type: integer }
                property_id: { type: integer }
                property_slug: { type: string }
                subject: { type: string, maxLength: 200 }
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "201":
          description: Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /conversations/unread-count:
    get:
      tags: [Messaging]
      operationId: unreadMessageCount
      summary: Unread messages across all conversations
      responses:
        "200": { $ref: "#/components/responses/UnreadCount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /conversations/contacts:
    get:
      tags: [Messaging]
      operationId: messageContacts
      summary: People the user may message (clients see active agents; agents and staff also see brokers/managers)
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Contacts (max 20)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        full_name: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /conversations/{conversation}:
    parameters:
      - { name: conversation, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Messaging]
      operationId: getConversation
      summary: Messages (latest 200) — marks the conversation read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /conversations/{conversation}/messages:
    parameters:
      - { name: conversation, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Messaging]
      operationId: sendMessage
      summary: "Send a message (immutable). Recipients get an in-app notification; e-mail at most hourly per conversation, without the text"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: hitlease-real-estate-api-session
      description: Sanctum SPA session cookie (first-party web only) + `X-XSRF-TOKEN` header on mutations.
    bearerToken:
      type: http
      scheme: bearer
      description: Sanctum personal access token (mobile).

  parameters:
    ClientChannel:
      name: X-Hitlease-Client
      in: header
      description: Set to `mobile` from the mobile app (MLS mobile-display rules).
      schema: { type: string, enum: [web, mobile] }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Optional. Retries with the same key and body return the first successful response (24 h); a different body is rejected (`idempotency_key_reused`).
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,100}$" }
    UserId:
      name: user
      in: path
      required: true
      schema: { type: integer }

  responses:
    UnreadCount:
      description: Unread notifications
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  count: { type: integer }
    Message:
      description: Informational message
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    ValidationError:
      description: "Validation failed (`validation_failed`, field errors in `details.fields`) or a business rule error"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "`unauthenticated`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`forbidden`, `account_deactivated`, `mfa_enrollment_required`, `role_escalation_denied`, …"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict (e.g. `mfa_already_enabled`, `role_locked`, `mls_not_authorized`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CsrfMismatch:
      description: "`csrf_token_mismatch`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "`too_many_requests` or `too_many_attempts` (see `Retry-After`)"
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [validation_failed, invalid_credentials, mfa_required] }
            message: { type: string }
            details:
              type: [object, "null"]
              properties:
                fields:
                  type: object
                  additionalProperties: { type: array, items: { type: string } }
                retry_after: { type: integer }
            request_id: { type: [string, "null"] }

    Password:
      type: string
      minLength: 12
      maxLength: 128
      description: Must contain upper and lower case letters, a number and a symbol; breached passwords are rejected in production.
      writeOnly: true

    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, writeOnly: true }
        code: { type: string, description: TOTP code when MFA is enabled }

    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password, password_confirmation, accept_terms]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: [string, "null"] }
        password: { $ref: "#/components/schemas/Password" }
        password_confirmation: { type: string }
        locale: { type: string, enum: [en, es] }
        account_type: { type: string, enum: [buyer, seller], default: buyer }
        device_name: { type: string, maxLength: 100 }
        accept_terms: { type: boolean, const: true }

    RoleName:
      type: string
      enum: [super_admin, broker, office_manager, agent, seller, buyer]

    User:
      type: object
      required: [id, first_name, last_name, full_name, email, status, email_verified, mfa_enabled]
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, "null"] }
        locale: { type: string, enum: [en, es] }
        timezone: { type: string }
        status: { type: string, enum: [active, deactivated] }
        email_verified: { type: boolean }
        mfa_enabled: { type: boolean }
        is_staff: { type: boolean }
        roles:
          type: array
          items:
            type: object
            properties:
              name: { $ref: "#/components/schemas/RoleName" }
              display_name: { type: string }
        permissions:
          type: array
          description: Effective permissions (only on own-user endpoints).
          items: { type: string }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }

    AccessToken:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_at: { type: [string, "null"], format: date-time }

    LoginResult:
      type: object
      required: [mfa_required]
      properties:
        mfa_required: { type: boolean }
        data: { $ref: "#/components/schemas/User" }

    AuthSession:
      type: object
      properties:
        id: { type: string, examples: ["token:42"] }
        type: { type: string, enum: [web, token] }
        name: { type: string }
        ip_address: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        is_current: { type: boolean }

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { $ref: "#/components/schemas/RoleName" }
        display_name: { type: string }
        description: { type: [string, "null"] }
        level: { type: integer }
        is_staff: { type: boolean }
        is_system: { type: boolean }
        users_count: { type: integer }
        permissions: { type: array, items: { type: string } }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        category: { type: string, enum: [security, admin, data, mls] }
        event: { type: string, examples: [auth.login.succeeded] }
        user:
          type: [object, "null"]
          properties:
            id: { type: integer }
            full_name: { type: string }
            email: { type: string }
        auditable_type: { type: [string, "null"] }
        auditable_id: { type: [integer, "null"] }
        old_values: { type: [object, "null"] }
        new_values: { type: [object, "null"] }
        metadata: { type: [object, "null"] }
        ip_address: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    PaginationMeta:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: [string, "null"] }
            last: { type: [string, "null"] }
            prev: { type: [string, "null"] }
            next: { type: [string, "null"] }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }

    UserPage:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/User" } }

    AuditLogPage:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }

    MlsProviderStatus:
      type: string
      enum: [pending_authorization, sandbox, authorized, suspended]

    MlsDisplayRule:
      type: object
      properties:
        attribution_template: { type: [string, "null"], examples: ["Listing courtesy of {broker}"] }
        disclaimer: { type: [string, "null"] }
        min_refresh_minutes: { type: integer }
        retention_days: { type: [integer, "null"] }
        allowed_fields: { type: [array, "null"], items: { type: string } }
        photo_rules:
          type: [object, "null"]
          properties:
            max_photos: { type: integer }
        allow_public_display: { type: boolean, default: false }
        allow_mobile_display: { type: boolean, default: false }
        allow_ai_processing: { type: boolean, default: false }
        hide_withdrawn_immediately: { type: boolean, default: true }

    MlsProviderInput:
      type: object
      properties:
        code: { type: string, pattern: "^[a-z0-9_]+$" }
        name: { type: string }
        driver: { type: string, enum: [reso_web_api, njmls, gsmls, bright, fixture] }
        protocol: { type: string, enum: [reso_web_api, rets, other] }
        website: { type: [string, "null"], format: uri }
        notes: { type: [string, "null"] }
        display_rule: { $ref: "#/components/schemas/MlsDisplayRule" }

    MlsProvider:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        driver: { type: string }
        protocol: { type: string }
        status: { $ref: "#/components/schemas/MlsProviderStatus" }
        is_enabled: { type: boolean }
        website: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        display_rule: { $ref: "#/components/schemas/MlsDisplayRule" }
        connections:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              environment: { type: string, enum: [sandbox, production] }
              base_url: { type: [string, "null"] }
              token_url: { type: [string, "null"] }
              status: { type: string, enum: [inactive, verified, error] }
              credential_keys:
                type: array
                description: Names of stored credential fields — values are never returned.
                items: { type: string }
              last_authenticated_at: { type: [string, "null"], format: date-time }
              last_synced_at: { type: [string, "null"], format: date-time }
              last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConnectionTestResult:
      type: object
      properties:
        success: { type: boolean }
        error:
          type: [object, "null"]
          properties:
            code: { type: string }
            message: { type: string }

    LanguageCode:
      type: string
      enum: [en, es, pt, fr, it, pl, zh, ko, hi, gu, ar, ru, ht, tl]

    Specialty:
      type: string
      enum: [buyers, sellers, rentals, first_time_buyers, luxury, condos, multi_family, new_construction, commercial, land, relocation, investment, seniors]

    LicenseStatus:
      type: string
      enum: [pending_verification, verified, rejected, expired, revoked]

    VerificationSource:
      type: string
      enum: [state_license_lookup, document_review, regulator_confirmation]

    LicenseSubmission:
      type: object
      required: [license_number, license_type]
      properties:
        license_number: { type: string, minLength: 4, maxLength: 40 }
        license_state: { type: string, minLength: 2, maxLength: 2, default: NJ }
        license_type: { type: string, enum: [salesperson, broker_salesperson, broker, referral_agent] }
        issued_on: { type: string, format: date }
        expires_on: { type: string, format: date }

    LicenseReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 2000 }

    AgentLicense:
      type: object
      properties:
        id: { type: integer }
        agent_id: { type: integer }
        license_number: { type: string }
        license_state: { type: string }
        license_type: { type: string }
        license_type_label: { type: string }
        status: { $ref: "#/components/schemas/LicenseStatus" }
        is_currently_valid: { type: boolean }
        issued_on: { type: [string, "null"], format: date }
        expires_on: { type: [string, "null"], format: date }
        verified_at: { type: [string, "null"], format: date-time }
        verified_by:
          type: [object, "null"]
          properties:
            id: { type: integer }
            full_name: { type: string }
        verification_source: { oneOf: [{ $ref: "#/components/schemas/VerificationSource" }, { type: "null" }] }
        verification_reference: { type: [string, "null"] }
        verification_notes: { type: [string, "null"] }
        status_reason: { type: [string, "null"] }
        status_changed_at: { type: [string, "null"], format: date-time }
        agent:
          type: object
          properties:
            id: { type: integer }
            full_name: { type: string }
            email: { type: string }
            user_id: { type: integer }
        created_at: { type: string, format: date-time }

    AgentProfileInput:
      type: object
      properties:
        office_id: { type: [integer, "null"] }
        public_email: { type: [string, "null"], format: email }
        public_phone: { type: [string, "null"] }
        bio: { type: [string, "null"], maxLength: 5000 }
        bio_es: { type: [string, "null"], maxLength: 5000 }
        languages: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/LanguageCode" } }
        specialties: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Specialty" } }
        photo_url: { type: [string, "null"], format: uri }
        is_public: { type: boolean }
        joined_on: { type: [string, "null"], format: date }

    Agent:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        user:
          type: object
          properties:
            id: { type: integer }
            full_name: { type: string }
            email: { type: string }
            status: { type: string }
        agency:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        office:
          type: [object, "null"]
          properties:
            id: { type: integer }
            name: { type: string }
            city: { type: string }
        status: { type: string, enum: [active, inactive] }
        is_public: { type: boolean }
        public_email: { type: [string, "null"] }
        public_phone: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        bio_es: { type: [string, "null"] }
        languages: { type: array, items: { type: string } }
        specialties: { type: array, items: { type: string } }
        photo_url: { type: [string, "null"] }
        joined_on: { type: [string, "null"], format: date }
        license_verified: { type: boolean }
        verified_license: { oneOf: [{ $ref: "#/components/schemas/AgentLicense" }, { type: "null" }] }
        licenses: { type: array, items: { $ref: "#/components/schemas/AgentLicense" } }
        created_at: { type: string, format: date-time }

    PublicAgent:
      type: object
      properties:
        slug: { type: string }
        full_name: { type: string }
        first_name: { type: string }
        photo_url: { type: [string, "null"] }
        email: { type: [string, "null"], description: Public contact e-mail chosen by the agent }
        phone: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        bio_es: { type: [string, "null"] }
        languages: { type: array, items: { type: string } }
        specialties: { type: array, items: { type: string } }
        agency:
          type: object
          properties:
            name: { type: string }
            license_number: { type: [string, "null"] }
        office:
          type: [object, "null"]
          properties:
            name: { type: string }
            street_address: { type: string }
            unit: { type: [string, "null"] }
            city: { type: string }
            state: { type: string }
            postal_code: { type: string }
            phone: { type: [string, "null"] }
        license:
          type: object
          properties:
            type: { type: string }
            type_label: { type: string }
            state: { type: string }
            number: { type: string }
            verified: { type: boolean, const: true }

    AgencyInput:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        legal_name: { type: [string, "null"] }
        license_number: { type: [string, "null"], description: Brokerage licence as entered (not verified) }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        website: { type: [string, "null"], format: uri }
        timezone: { type: string, examples: [America/New_York] }

    Agency:
      allOf:
        - $ref: "#/components/schemas/AgencyInput"
        - type: object
          properties:
            id: { type: integer }
            slug: { type: string }
            offices_count: { type: integer }
            agents_count: { type: integer }
            offices: { type: array, items: { $ref: "#/components/schemas/Office" } }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    OfficeInput:
      type: object
      properties:
        agency_id: { type: integer, description: Required on create; cannot be changed }
        name: { type: string }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        street_address: { type: string }
        unit: { type: [string, "null"] }
        city: { type: string }
        county: { type: [string, "null"] }
        state: { type: string, default: NJ }
        postal_code: { type: string, pattern: "^\\d{5}(-\\d{4})?$" }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        is_headquarters: { type: boolean }
        is_active: { type: boolean }

    Office:
      allOf:
        - $ref: "#/components/schemas/OfficeInput"
        - type: object
          properties:
            id: { type: integer }
            slug: { type: string }
            agents_count: { type: integer }

    PropertyTypeCode:
      type: string
      enum: [single_family, condominium, townhouse, multi_family, apartment, land, commercial, rental]

    PropertyInput:
      type: object
      properties:
        title: { type: string, minLength: 5, maxLength: 200, description: Required on create }
        listing_type: { type: string, enum: [sale, rent], description: Required on create }
        description: { type: [string, "null"] }
        description_es: { type: [string, "null"] }
        property_type_id: { type: [integer, "null"] }
        property_subtype: { type: [string, "null"] }
        status: { type: string, enum: [active, coming_soon, active_under_contract, pending, closed, withdrawn, expired, canceled] }
        list_price: { type: [number, "null"], minimum: 0 }
        listing_agent_id: { type: [integer, "null"], description: Ignored/validated for agents (always their own profile) }
        street_address: { type: [string, "null"] }
        unit: { type: [string, "null"] }
        city: { type: [string, "null"] }
        county: { type: [string, "null"] }
        state: { type: string, default: NJ }
        postal_code: { type: [string, "null"] }
        address_display: { type: boolean }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        bedrooms: { type: [integer, "null"] }
        bathrooms: { type: [number, "null"], multipleOf: 0.5 }
        living_area_sqft: { type: [integer, "null"] }
        lot_size_sqft: { type: [number, "null"] }
        year_built: { type: [integer, "null"] }
        parking_spaces: { type: [integer, "null"] }
        garage_spaces: { type: [integer, "null"] }
        heating: { type: array, items: { type: string } }
        cooling: { type: array, items: { type: string } }
        amenities: { type: array, items: { $ref: "#/components/schemas/Amenity" } }
        hoa_fee_monthly: { type: [number, "null"] }
        annual_taxes: { type: [number, "null"] }

    PropertyMedia:
      type: object
      properties:
        id: { type: integer }
        source: { type: string, enum: [upload, mls] }
        url: { type: [string, "null"] }
        mime_type: { type: [string, "null"] }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        caption: { type: [string, "null"] }
        sort_order: { type: integer }
        display_allowed: { type: boolean }

    ManagedProperty:
      allOf:
        - $ref: "#/components/schemas/PropertyInput"
        - type: object
          properties:
            id: { type: integer }
            slug: { type: string }
            source: { type: string, enum: [internal, mls] }
            is_published: { type: boolean }
            published_at: { type: [string, "null"], format: date-time }
            publication_missing: { type: array, items: { type: string }, description: Fields still required before publishing }
            property_type: { type: [object, "null"] }
            listing_agent: { type: [object, "null"] }
            mls:
              type: [object, "null"]
              properties:
                provider: { type: string }
                listing_id: { type: [string, "null"] }
                listing_key: { type: string }
                listing_broker: { type: [string, "null"] }
                last_synced_at: { type: [string, "null"], format: date-time }
                removed_at: { type: [string, "null"], format: date-time }
            media: { type: array, items: { $ref: "#/components/schemas/PropertyMedia" } }
            status_history:
              type: array
              items:
                type: object
                properties:
                  from_status: { type: [string, "null"] }
                  to_status: { type: string }
                  from_price: { type: [number, "null"] }
                  to_price: { type: [number, "null"] }
                  source: { type: string }
                  changed_at: { type: string, format: date-time }

    Appointment:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [requested, confirmed, declined, cancelled, completed, no_show] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string, examples: [America/New_York] }
        property:
          oneOf:
            - type: object
              properties:
                slug: { type: string }
                title: { type: string }
                street_address: { type: [string, "null"], description: "Shown to hosts, for confirmed showings, or when the listing shows it" }
                city: { type: [string, "null"] }
                state: { type: string }
            - type: "null"
        agent:
          type: object
          properties:
            id: { type: integer }
            full_name: { type: [string, "null"] }
            phone: { type: [string, "null"] }
        contact:
          description: Hosts and managers only
          oneOf:
            - type: object
              properties:
                name: { type: string }
                email: { type: [string, "null"] }
                phone: { type: [string, "null"] }
            - type: "null"
        lead_id: { type: [integer, "null"], description: Hosts and managers only }
        notes: { type: [string, "null"] }
        status_reason: { type: [string, "null"] }
        feedback:
          description: Hosts and managers only
          oneOf:
            - type: object
              properties:
                rating: { type: [integer, "null"] }
