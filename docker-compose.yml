# Local/staging stack for App Inmobiliaria Real Estate.
#   cp .env.example .env   # fill in values (no real secrets are committed)
#   docker compose up -d --build
#   docker compose run --rm api php artisan migrate --seed
# Web: http://localhost  ·  API: http://api.localhost  (nginx)

name: app_inmobiliaria

x-api: &api
  build:
    context: .
    dockerfile: infrastructure/docker/api/Dockerfile
  image: app-inmobiliaria/api:local
  env_file: .env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    # Listing photos (MEDIA_DISK=public) until the Cloudflare R2 bucket exists.
    - api-media:/var/www/html/storage/app/public
    # Private transaction documents (DOCUMENTS_DISK=local); never served by nginx.
    - api-documents:/var/www/html/storage/app/private
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app_inmobiliaria}
      POSTGRES_USER: ${DB_USERNAME:-app_inmobiliaria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *api

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,notifications,mls-sync,mls-media,documents", "--tries=3", "--backoff=10,60,300", "--max-time=3600"]
    healthcheck:
      disable: true

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    image: app-inmobiliaria/web:local
    environment:
      # Server-side (SSR) requests stay on the Compose network: `api.localhost`
      # would resolve to the web container's own loopback.
      API_INTERNAL_URL: http://api-internal
      # Same secret as the API's API_SSR_KEY: SSR requests are rate-limited per visitor.
      API_SSR_KEY: ${API_SSR_KEY:-}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/var/www/html/public:ro
      - api-media:/var/www/media:ro
    depends_on:
      - api
      - web
    networks:
      default:
        aliases:
          - api-internal
    restart: unless-stopped

  # Optional malware scanning for uploaded documents:
  #   docker compose --profile antivirus up -d   and set DOCUMENT_SCANNER=clamd, CLAMD_HOST=clamav
  clamav:
    image: clamav/clamav:1.4
    profiles: [antivirus]
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  api-media:
  api-documents:
  clamav-data:
