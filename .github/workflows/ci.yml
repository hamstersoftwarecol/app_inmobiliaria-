name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.47.7"

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: hitlease_test
          POSTGRES_USER: hitlease
          POSTGRES_PASSWORD: hitlease
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hitlease -d hitlease_test"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: hitlease
      DB_PASSWORD: hitlease
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath, gd
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Dependency audit
        run: composer audit
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate migrations (up, down, up)
        env:
          DB_DATABASE: hitlease_test
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force --seed
          php artisan db:wipe --force
      - name: Tests
        env:
          DB_DATABASE: hitlease_test
        run: php artisan test

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright, real API)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: hitlease
          POSTGRES_USER: hitlease
          POSTGRES_PASSWORD: hitlease
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hitlease -d hitlease"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start API
        working-directory: apps/api
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=hitlease/' .env
          echo "SECURITY_AUTH_REQUESTS_PER_MINUTE=200" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "MAIL_MAILER=log" >> .env
          # Throwaway CI value (not a secret): exercises per-visitor SSR rate limiting.
          sed -i 's/^API_SSR_KEY=.*/API_SSR_KEY=ci-only-ssr-key/' .env
          php artisan key:generate
          php artisan migrate --force --seed
          php artisan db:seed --class=E2ESeeder --force
          php artisan storage:link
          php artisan serve --port=8000 > /tmp/api.log 2>&1 &
      - name: Build and test web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          API_SSR_KEY: ci-only-ssr-key
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            /tmp/api.log
          retention-days: 7

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          # Normalize generated files to the repo formatter settings before comparing.
          dart format lib
          git diff --exit-code -- lib
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug

  contracts:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx --yes @redocly/cli@1.34.5 lint docs/api/openapi.yaml --config docs/api/redocly.yaml

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api/Dockerfile
          push: false
          tags: hitlease/api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web/Dockerfile
          push: false
          tags: hitlease/web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            NEXT_PUBLIC_SITE_URL=https://www.example.com
