name: Deploy

# Controlled deployment: manual trigger + GitHub Environment protection rules
# (configure required reviewers for "staging" and "production" in the repo
# settings). This workflow builds and publishes versioned images to GHCR.
# The rollout step is intentionally a documented placeholder until the
# hosting target is chosen — see docs/deployment/README.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api=${repo}/api:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "web=${repo}/web:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.api }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.web }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
      - name: Roll out (pending hosting decision)
        run: |
          echo "Images published:"
          echo "  ${{ steps.names.outputs.api }}"
          echo "  ${{ steps.names.outputs.web }}"
          echo "Rollout is not automated yet: follow docs/deployment/README.md (run migrations once, then update services)."
