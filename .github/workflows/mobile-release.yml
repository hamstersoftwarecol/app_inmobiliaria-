name: Mobile release build

# Manual: builds a store-ready Android App Bundle signed with the upload key kept in
# repository secrets. iOS archives need macOS signing assets and are built from Xcode for now.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production API base URL (https://…)
        required: true
      app_link_host:
        description: Website host whose links open in the app (e.g. www.example.com)
        required: true
      build_number:
        description: Store build number (must increase on every upload)
        required: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  android:
    name: Android App Bundle
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Check inputs and signing secrets
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          [[ "$API_BASE_URL" == https://* ]] || { echo "api_base_url must use https"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "build_number must be an integer"; exit 1; }
          [[ -n "$KEYSTORE" ]] || { echo "Missing secret ANDROID_UPLOAD_KEYSTORE_BASE64 (see apps/mobile/README.md)"; exit 1; }
      - name: Restore upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - run: flutter pub get
      - run: flutter test
      - name: Build signed App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_LINK_HOST: ${{ inputs.app_link_host }}
          API_BASE_URL: ${{ inputs.api_base_url }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --obfuscate --split-debug-info=build/symbols
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.build_number }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/symbols
          retention-days: 30
